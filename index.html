<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Suryansh Pro Tasker</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #050505; color: #00ff00; text-align: center; padding: 20px; margin: 0; }
        .container { background: #111; padding: 25px; border-radius: 10px; max-width: 600px; margin: auto; border: 1px solid #00ff00; box-shadow: 0 0 20px rgba(0, 255, 0, 0.2); }
        h1 { text-shadow: 0 0 10px #00ff00; letter-spacing: 2px; }

        /* Stats & Gamification */
        .stats-board { display: flex; justify-content: space-around; background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px dashed #00ff00; margin-bottom: 20px; font-size: 1.2em; font-weight: bold; }
        .xp-text { color: #f1c40f; text-shadow: 0 0 5px #f1c40f; }
        .streak-text { color: #e74c3c; text-shadow: 0 0 5px #e74c3c; }

        /* Pomodoro Timer */
        .timer-box { background: #1a0000; border: 1px solid #ff0000; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        #timeDisplay { font-size: 2.5em; font-weight: bold; display: block; margin-bottom: 10px; color: #ff4444; }
        .timer-btn { background: transparent; color: #ff4444; border: 1px solid #ff4444; padding: 8px 15px; cursor: pointer; border-radius: 4px; transition: 0.3s; margin: 5px; }
        .timer-btn:hover { background: #ff4444; color: #000; }
        #customMinutes { width: 80px; text-align: center; font-size: 1.2em; margin-bottom: 10px; padding: 8px; background: #000; border: 1px solid #ff4444; color: #ff4444; border-radius: 4px; outline: none; }
        .warning-text { color: #ffaa00; font-size: 0.8em; margin-top: 10px; display: block; }

        /* Inputs & Buttons */
        input[type="text"], input[type="datetime-local"], select, textarea { padding: 12px; width: 90%; margin: 8px 0; background: #000; border: 1px solid #00ff00; color: #00ff00; border-radius: 4px; font-family: 'Courier New', monospace; outline: none; box-sizing: border-box;}
        button.add-btn { background: #00ff00; color: #000; border: none; padding: 12px; width: 90%; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 1.1em; text-transform: uppercase; margin-top: 10px; transition: 0.3s;}
        button.add-btn:hover { box-shadow: 0 0 15px #00ff00; }

        /* Task & Idea Lists */
        ul { list-style: none; padding: 0; text-align: left; }
        li { background: #111; padding: 15px; margin-top: 12px; border: 1px solid #333; border-left: 5px solid #00ff00; display: flex; flex-direction: column; transition: 0.3s; }
        li.completed { opacity: 0.5; text-decoration: line-through; border-left: 5px solid #555; }
        .task-header { display: flex; justify-content: space-between; align-items: center; font-size: 1.1em; }

        /* Idea Vault Section */
        .vault-section { margin-top: 40px; padding-top: 20px; border-top: 2px dashed #00ff00; }
        .idea-item { border-left: 5px solid #9b59b6; }
        .delete-btn { background: transparent; border: 1px solid #e74c3c; color: #e74c3c; padding: 2px 8px; cursor: pointer; font-size: 0.8em; }
    </style>
</head>
<body>

<div class="container">
    <h1>[ SYSTEM_ONLINE ]</h1>

    <div class="stats-board">
        <div>XP: <span id="xpCount" class="xp-text">0</span></div>
        <div>STREAK: <span id="streakCount" class="streak-text">🔥 0</span></div>
    </div>

    <div class="timer-box">
        <input type="number" id="customMinutes" placeholder="Min">
        <span id="timeDisplay">00:00</span>
        <button class="timer-btn" onclick="startTimer()">▶ Start Focus</button>
        <button class="timer-btn" onclick="resetTimer()">⏹ Reset</button>
        <span class="warning-text">⚠️ WARNING: Tab change kiya toh 50 XP kategi!</span>
    </div>

    <input type="text" id="taskInput" placeholder="> Enter new mission...">
    <input type="datetime-local" id="dateInput">
    <button class="add-btn" onclick="addTask()">Deploy Task</button>
    <ul id="taskList"></ul>

    <div class="vault-section">
        <h2>🧠 IDEA VAULT</h2>
        <textarea id="ideaInput" rows="3" placeholder="> Dump crazy experiment & vlog ideas here..."></textarea>
        <button class="add-btn" style="background: #9b59b6; color: white;" onclick="addIdea()">Save Idea</button>
        <ul id="ideaList"></ul>
    </div>
</div>

<script>
    // --- GAMIFICATION & XP LOGIC ---
    let xp = parseInt(localStorage.getItem('hackerXP')) || 0;
    let streak = parseInt(localStorage.getItem('hackerStreak')) || 0;

    document.getElementById('xpCount').innerText = xp;
    document.getElementById('streakCount').innerText = "🔥 " + streak;

    function updateXP(amount) {
        xp += amount;
        if (xp < 0) xp = 0; // XP 0 se kam nahi ho sakti
        localStorage.setItem('hackerXP', xp);
        document.getElementById('xpCount').innerText = xp;
    }

    // --- STRICT FOCUS PENALTY (THE KILLER FEATURE) ---
    let isTimerRunning = false;

    document.addEventListener("visibilitychange", function() {
        if (document.hidden && isTimerRunning) {
            // User ne tab change kiya!
            alert("🚨 PENALTY! Focus ke waqt tab change kyu kiya? -50 XP!");
            updateXP(-50); // 50 XP kaat lo
            resetTimer(); // Timer rok do
        }
    });

    // --- TIMER LOGIC ---
    let timerInterval;
    let timeLeft = 0;

    function updateTimerDisplay() {
        let m = Math.floor(timeLeft / 60);
        let s = timeLeft % 60;
        document.getElementById('timeDisplay').innerText = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
    }

    function startTimer() {
        let userMinutes = parseInt(document.getElementById('customMinutes').value);
        if(isNaN(userMinutes) || userMinutes <= 0) return alert("Sahi time daal!");

        clearInterval(timerInterval);
        timeLeft = userMinutes * 60;
        updateTimerDisplay();
        isTimerRunning = true; // Timer shuru ho gaya

        timerInterval = setInterval(() => {
            if(timeLeft > 0) {
                timeLeft--;
                updateTimerDisplay();
            } else {
                clearInterval(timerInterval);
                isTimerRunning = false; // Timer khatam
                alert("Focus Complete! +20 XP mil gaye!");
                updateXP(20); // Focus complete karne par extra XP
                let audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
                audio.play();
            }
        }, 1000);
    }

    function resetTimer() {
        clearInterval(timerInterval);
        isTimerRunning = false;
        document.getElementById('timeDisplay').innerText = "00:00";
        document.getElementById('customMinutes').value = "";
    }

    // --- TASK MANAGER ---
    let tasks = JSON.parse(localStorage.getItem('hackerTasks')) || [];
    document.addEventListener('DOMContentLoaded', renderTasks);

    function addTask() {
        let text = document.getElementById('taskInput').value;
        let date = document.getElementById('dateInput').value;
        if(text === "") return;

        tasks.push({ id: Date.now(), text, date, done: false });
        localStorage.setItem('hackerTasks', JSON.stringify(tasks));
        document.getElementById('taskInput').value = "";
        renderTasks();
    }

    function completeTask(id) {
        let task = tasks.find(t => t.id === id);
        if(!task.done) {
            task.done = true;
            updateXP(10); // Task done par 10 XP
            localStorage.setItem('hackerTasks', JSON.stringify(tasks));
            renderTasks();
        }
    }

    function renderTasks() {
        let list = document.getElementById('taskList');
        list.innerHTML = "";
        tasks.forEach(task => {
            let li = document.createElement('li');
            if(task.done) li.className = "completed";
            li.innerHTML = `
                    <div class="task-header">
                        <span>${task.text}</span>
                        ${!task.done ? `<button class="check-btn" onclick="completeTask(${task.id})">✔ DONE</button>` : '<span>✅</span>'}
                    </div>
                `;
            list.appendChild(li);
        });
    }

    // --- IDEA VAULT LOGIC ---
    let ideas = JSON.parse(localStorage.getItem('hackerIdeas')) || [];
    document.addEventListener('DOMContentLoaded', renderIdeas);

    function addIdea() {
        let text = document.getElementById('ideaInput').value;
        if(text === "") return;
        ideas.push({ id: Date.now(), text });
        localStorage.setItem('hackerIdeas', JSON.stringify(ideas));
        document.getElementById('ideaInput').value = "";
        renderIdeas();
    }

    function deleteIdea(id) {
        ideas = ideas.filter(i => i.id !== id);
        localStorage.setItem('hackerIdeas', JSON.stringify(ideas));
        renderIdeas();
    }

    function renderIdeas() {
        let list = document.getElementById('ideaList');
        list.innerHTML = "";
        ideas.forEach(idea => {
            let li = document.createElement('li');
            li.className = "idea-item";
            li.innerHTML = `
                    <div class="task-header">
                        <span>${idea.text}</span>
                        <button class="delete-btn" onclick="deleteIdea(${idea.id})">X</button>
                    </div>
                `;
            list.appendChild(li);
        });
    }
</script>
</body>
</html>
