<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Suryansh Pro Tasker</title>
    <style>
        /* Hacker Theme CSS */
        body { font-family: 'Courier New', Courier, monospace; background: #050505; color: #00ff00; text-align: center; padding: 20px; margin: 0; }
        .container { background: #111; padding: 25px; border-radius: 10px; max-width: 600px; margin: auto; border: 1px solid #00ff00; box-shadow: 0 0 20px rgba(0, 255, 0, 0.2); }
        h1 { text-shadow: 0 0 10px #00ff00; letter-spacing: 2px; }

        /* Stats & Gamification */
        .stats-board { display: flex; justify-content: space-around; background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px dashed #00ff00; margin-bottom: 20px; font-size: 1.2em; font-weight: bold; }
        .xp-text { color: #f1c40f; text-shadow: 0 0 5px #f1c40f; }
        .streak-text { color: #e74c3c; text-shadow: 0 0 5px #e74c3c; }

        /* Pomodoro Timer */
        .timer-box { background: #0a0a0a; border: 1px solid #00ff00; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        #timeDisplay { font-size: 2.5em; font-weight: bold; display: block; margin-bottom: 10px; }
        .timer-btn { background: transparent; color: #00ff00; border: 1px solid #00ff00; padding: 8px 15px; cursor: pointer; border-radius: 4px; transition: 0.3s; }
        .timer-btn:hover { background: #00ff00; color: #000; }

        /* Inputs */
        input, select { padding: 12px; width: 90%; margin: 8px 0; background: #000; border: 1px solid #00ff00; color: #00ff00; border-radius: 4px; font-family: 'Courier New', monospace; outline: none; box-sizing: border-box;}
        button.add-btn { background: #00ff00; color: #000; border: none; padding: 12px; width: 90%; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 1.1em; text-transform: uppercase; margin-top: 10px; transition: 0.3s;}
        button.add-btn:hover { box-shadow: 0 0 15px #00ff00; }

        /* Task List */
        ul { list-style: none; padding: 0; text-align: left; }
        li { background: #111; padding: 15px; margin-top: 12px; border: 1px solid #333; border-left: 5px solid #00ff00; display: flex; flex-direction: column; transition: 0.3s; }
        li.completed { opacity: 0.5; text-decoration: line-through; border-left: 5px solid #555; }
        .task-header { display: flex; justify-content: space-between; align-items: center; font-size: 1.1em; }
        .task-cat { font-size: 0.75em; background: #00ff00; color: #000; padding: 2px 6px; border-radius: 3px; font-weight: bold; }
        .task-date { font-size: 0.8em; color: #888; margin-top: 5px; }
        .check-btn { background: transparent; border: 1px solid #00ff00; color: #00ff00; padding: 5px 10px; cursor: pointer; border-radius: 3px; }
        .check-btn:hover { background: #00ff00; color: #000; }
    </style>
</head>
<body>

<div class="container">
    <h1>[ SYSTEM_ONLINE ]</h1>

    <div class="stats-board">
        <div>XP: <span id="xpCount" class="xp-text">0</span></div>
        <div>STREAK: <span id="streakCount" class="streak-text">🔥 0</span></div>
    </div>

    <div class="timer-box">
        <span id="timeDisplay">25:00</span>
        <button class="timer-btn" onclick="startTimer()">▶ Start Focus</button>
        <button class="timer-btn" onclick="resetTimer()">⏹ Reset</button>
    </div>

    <input type="text" id="taskInput" placeholder="> Enter new mission...">

    <select id="categoryInput">
        <option value="💡 Idea / Script">💡 Idea / Script</option>
        <option value="🎥 Vlog Shoot">🎥 Vlog Shoot</option>
        <option value="🎬 DaVinci Edit">🎬 DaVinci Edit</option>
        <option value="☕ Java Code">☕ Java Code</option>
        <option value="⚡ General">⚡ General</option>
    </select>

    <input type="datetime-local" id="dateInput">

    <button class="add-btn" onclick="addTask()">Deploy Task</button>

    <ul id="taskList"></ul>
</div>

<script>
    // --- GAMIFICATION LOGIC ---
    let xp = parseInt(localStorage.getItem('hackerXP')) || 0;
    let streak = parseInt(localStorage.getItem('hackerStreak')) || 0;
    let lastLogin = localStorage.getItem('lastLoginDate');

    let today = new Date().toDateString();
    if(lastLogin !== today) {
        if(lastLogin === new Date(Date.now() - 86400000).toDateString()) {
            streak++; // Logged in consecutive day
        } else if (lastLogin !== null) {
            streak = 0; // Streak broken
        }
        localStorage.setItem('lastLoginDate', today);
        localStorage.setItem('hackerStreak', streak);
    }

    document.getElementById('xpCount').innerText = xp;
    document.getElementById('streakCount').innerText = "🔥 " + streak;

    function addXP() {
        xp += 10;
        localStorage.setItem('hackerXP', xp);
        document.getElementById('xpCount').innerText = xp;
    }

    // --- TASK MANAGER LOGIC ---
    let tasks = JSON.parse(localStorage.getItem('hackerTasks')) || [];
    document.addEventListener('DOMContentLoaded', renderTasks);

    function addTask() {
        let text = document.getElementById('taskInput').value;
        let cat = document.getElementById('categoryInput').value;
        let date = document.getElementById('dateInput').value;

        if(text === "") return alert("Mission details required!");

        tasks.push({ id: Date.now(), text, cat, date, done: false });
        saveAndRender();

        document.getElementById('taskInput').value = "";
        document.getElementById('dateInput').value = "";
    }

    function completeTask(id) {
        let task = tasks.find(t => t.id === id);
        if(!task.done) {
            task.done = true;
            addXP(); // Add XP only when completing
            saveAndRender();
        }
    }

    function saveAndRender() {
        localStorage.setItem('hackerTasks', JSON.stringify(tasks));
        renderTasks();
    }

    function renderTasks() {
        let list = document.getElementById('taskList');
        list.innerHTML = "";

        tasks.forEach(task => {
            let li = document.createElement('li');
            if(task.done) li.className = "completed";

            let displayDate = task.date ? new Date(task.date).toLocaleString('en-IN') : "No deadline";

            li.innerHTML = `
                    <div class="task-header">
                        <span>${task.text} <span class="task-cat">${task.cat}</span></span>
                        ${!task.done ? `<button class="check-btn" onclick="completeTask(${task.id})">✔ DONE</button>` : '<span>✅</span>'}
                    </div>
                    <div class="task-date">🕒 Due: ${displayDate}</div>
                `;
            list.appendChild(li);
        });
    }

    // --- POMODORO TIMER LOGIC ---
    let timerInterval;
    let timeLeft = 1500; // 25 minutes in seconds

    function updateTimerDisplay() {
        let m = Math.floor(timeLeft / 60);
        let s = timeLeft % 60;
        document.getElementById('timeDisplay').innerText = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
    }

    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if(timeLeft > 0) {
                timeLeft--;
                updateTimerDisplay();
            } else {
                clearInterval(timerInterval);
                alert("Focus Session Complete! Take a 5 min break.");
                let audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
                audio.play();
            }
        }, 1000);
    }

    function resetTimer() {
        clearInterval(timerInterval);
        timeLeft = 1500;
        updateTimerDisplay();
    }
</script>
</body>
</html>
